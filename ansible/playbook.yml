---
- name: Install Docker
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | tee /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        update_cache: yes
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

- name: Init Swarm
  hosts: manager
  become: true
  tasks:
    - name: Initialize Docker Swarm
      shell: docker swarm init --advertise-addr 192.168.10.51
      register: swarm_init
      ignore_errors: yes

    - name: Get worker join token
      shell: docker swarm join-token worker -q
      register: worker_token

    - name: Save token as fact
      set_fact:
        swarm_token: "{{ worker_token.stdout }}"

- name: Join workers to Swarm
  hosts: workers
  become: true
  tasks:
    - name: Join Swarm
      shell: docker swarm join --token {{ hostvars['192.168.10.51']['swarm_token'] }} 192.168.10.51:2377
      ignore_errors: yes

- name: Deploy Sock Shop
  hosts: manager
  become: true
  tasks:
    - name: Create app directory
      file:
        path: /opt/sockshop
        state: directory

    - name: Copy docker-compose.yml
      copy:
        src: files/docker-compose.yml
        dest: /opt/sockshop/docker-compose.yml

    - name: Deploy stack
      shell: docker stack deploy -c /opt/sockshop/docker-compose.yml sockshop